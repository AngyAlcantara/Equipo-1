<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="titulo-header">Dirección de entrega</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor-direccion">
    
    <ion-text>
      <p class="marca">Pipas Juárez</p>
    </ion-text>

    <div class="campo-grupo">
      <ion-text><p class="etiqueta">Dirección</p></ion-text>
      <ion-input fill="outline" placeholder="Calle y número"></ion-input>
    </div>

    <div class="campo-grupo">
      <ion-text><p class="etiqueta">Referencia</p></ion-text>
      <ion-input fill="outline" placeholder="Ej.Frente a una tienda"></ion-input>
    </div>

    <ion-button expand="block" fill="outline" routerLink="/solicitar-fecha" class="btn-continuar">
      CONTINUAR
    </ion-button>

  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-segment value="inicio">
      <ion-segment-button value="inicio" routerLink="/inicio">
        <ion-icon name="home"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-segment-button>

      <ion-segment-button value="mis-pedidos" routerLink="/mis-pedidos">
        <ion-icon name="clipboard-outline"></ion-icon>
        <ion-label>Mis Pedidos</ion-label>
      </ion-segment-button>

      <ion-segment-button value="perfil" routerLink="/perfil">
        <ion-icon name="person"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
