<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="titulo-header">Detalle del pedido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor-detalle">
    
    <ion-text>
      <h2 class="folio-titulo">Pedido #PJ-001</h2>
    </ion-text>

    <!-- Línea de estados -->
    <div class="lista-estados">
      <div class="estado-item">
        <span class="punto"></span>
        <ion-text><span class="texto-estado">EN PROCESO</span></ion-text>
      </div>

      <ion-icon name="checkmark" class="check-activo"></ion-icon>

      <div class="estado-item">
        <span class="punto"></span>
        <ion-text><span class="texto-estado">PEDIDO RECIBIDO</span></ion-text>
      </div>

      <div class="estado-item">
        <span class="punto"></span>
        <ion-text><span class="texto-estado">PREPARANDO</span></ion-text>
      </div>

      <div class="estado-item">
        <span class="punto"></span>
        <ion-text><span class="texto-estado">PIPA EN CAMINO</span></ion-text>
      </div>

      <div class="estado-item">
        <span class="punto"></span>
        <ion-text><span class="texto-estado">ENTREGADO</span></ion-text>
      </div>
    </div>

    <div class="separador"></div>

    <!-- Resumen inferior -->
    <div class="datos-entrega">
      <ion-text><p class="cantidad">10,000 litros</p></ion-text>
      <ion-text color="medium"><p class="dato">Calle ——————</p></ion-text>
      <ion-text color="medium"><p class="dato">25/09/2026</p></ion-text>
      <ion-text color="medium"><p class="dato">9:00 - 11:00</p></ion-text>
    </div>

    <ion-button expand="block" fill="outline" routerLink="/inicio" class="btn-volver">
      Volver al inicio
    </ion-button>

  </div>
</ion-content>
