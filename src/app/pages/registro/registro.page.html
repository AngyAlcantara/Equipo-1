<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Pipas Juárez</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <ion-text>
    <h2 class="titulo-registro">CREAR CUENTA</h2>
  </ion-text>

  <!-- Campo Nombre -->
  <div class="campo-grupo">
    <ion-text><p class="etiqueta">Nombre</p></ion-text>
    <ion-input 
      fill="outline" 
      placeholder="Ingrese su nombre"
      [(ngModel)]="nombre">
    </ion-input>
  </div>

  <!-- Campo Teléfono -->
  <div class="campo-grupo">
    <ion-text><p class="etiqueta">Teléfono</p></ion-text>
    <ion-input 
      fill="outline" 
      type="tel" 
      placeholder="Ingrese un numero de teléfono"
      [(ngModel)]="telefono">
    </ion-input>
  </div>

  <!-- Campo Correo -->
  <div class="campo-grupo">
    <ion-text><p class="etiqueta">Correo</p></ion-text>
    <ion-input 
      fill="outline" 
      type="email" 
      placeholder="Ingrese un correo"
      [(ngModel)]="correo">
    </ion-input>
  </div>

  <!-- Campo Contraseña -->
  <div class="campo-grupo">
    <ion-text><p class="etiqueta">Contraseña</p></ion-text>
    <ion-input 
      fill="outline" 
      type="password" 
      placeholder="Ingresa una contraseña"
      [(ngModel)]="password">
    </ion-input>
  </div>

  <!-- Botón Crear Cuenta con validación -->
  <ion-button expand="block" fill="outline" (click)="crearCuenta()" class="btn-crear">
    CREAR CUENTA
  </ion-button>

</ion-content>
