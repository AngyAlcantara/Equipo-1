<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title color="medium" class="titulo-header">Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor-recuperar">
    
    <ion-text>
      <h2 class="titulo-principal">¿Olvidaste tu contraseña?</h2>
    </ion-text>

    <ion-text color="medium">
      <p class="descripcion">
        Ingresa tu correo o teléfono para enviarte un código de recuperación.
      </p>
    </ion-text>

    <div class="campo-grupo">
      <ion-input fill="outline" placeholder="Correo / teléfono"></ion-input>
    </div>

    <ion-button expand="block" fill="outline" routerLink="/login" class="btn-enviar">
      Enviar código
    </ion-button>

    <div class="pie-enlace">
      <ion-text color="medium">
        <p>¿Ya recuerdas tu contraseña?</p>
      </ion-text>
      <ion-button fill="clear" routerLink="/login" class="btn-volver">
        Volver al inicio
      </ion-button>
    </div>

  </div>
</ion-content>
