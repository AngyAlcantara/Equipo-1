<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="titulo-pagina">Solicitar Pipa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor-solicitar">
    
    <ion-text>
      <p class="marca">Pipas Juárez</p>
    </ion-text>

    <ion-text>
      <h2 class="titulo-seccion">Elegir cantidad</h2>
    </ion-text>

    <ion-text>
      <h3 class="pregunta">¿Cuánta agua necesitas?</h3>
    </ion-text>

    <ion-radio-group value="5000">
      <ion-item lines="none" class="opcion-radio">
        <ion-radio slot="start" value="5000"></ion-radio>
        <ion-label>5,000 Litros</ion-label>
      </ion-item>

      <ion-item lines="none" class="opcion-radio">
        <ion-radio slot="start" value="10000"></ion-radio>
        <ion-label>10,000 Litros</ion-label>
      </ion-item>

      <ion-item lines="none" class="opcion-radio">
        <ion-radio slot="start" value="otra"></ion-radio>
        <ion-label>Otra cantidad &gt;</ion-label>
      </ion-item>
    </ion-radio-group>

    <ion-button expand="block" color="primary" routerLink="/solicitar-direccion" class="btn-continuar">
      CONTINUAR
    </ion-button>

  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-segment value="inicio">
      <ion-segment-button value="inicio" routerLink="/inicio">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-segment-button>

      <ion-segment-button value="mis-pedidos" routerLink="/mis-pedidos">
        <ion-icon name="clipboard-outline"></ion-icon>
        <ion-label>Pedidos</ion-label>
      </ion-segment-button>

      <ion-segment-button value="perfil" routerLink="/perfil">
        <ion-icon name="person"></ion-icon>
        <ion-label>Perfil</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-footer>
