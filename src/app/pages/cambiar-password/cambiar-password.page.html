<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/perfil" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="titulo-pagina">Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor-password">

    <!-- Tarjeta Contraseña actual -->
    <ion-card class="tarjeta-campo">
      <ion-card-content>
        <ion-text color="medium"><p class="etiqueta">Contraseña actual</p></ion-text>
        <ion-input fill="outline" type="password" placeholder="Ingrese su contraseña actual"></ion-input>
      </ion-card-content>
    </ion-card>

    <!-- Tarjeta Nueva contraseña -->
    <ion-card class="tarjeta-campo">
      <ion-card-content>
        <ion-text color="medium"><p class="etiqueta">Nueva contraseña</p></ion-text>
        <ion-input fill="outline" type="password" placeholder="Ingrese su nueva contraseña"></ion-input>
      </ion-card-content>
    </ion-card>

    <!-- Tarjeta Confirmar -->
    <ion-card class="tarjeta-campo">
      <ion-card-content>
        <ion-text color="medium"><p class="etiqueta">Confirmar</p></ion-text>
        <ion-input fill="outline" type="password" placeholder="Confirme su nueva contraseña"></ion-input>
      </ion-card-content>
    </ion-card>

    <!-- Botón Guardar alineado a la derecha -->
    <div class="fila-boton">
      <ion-button color="primary" routerLink="/perfil" class="btn-guardar">
        <ion-icon slot="start" name="save"></ion-icon>
        Guardar
      </ion-button>
    </div>

  </div>
</ion-content>
